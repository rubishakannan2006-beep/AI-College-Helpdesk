{% extends 'base.html' %}
{% block content %}
<div class="card chat-card">
  <div class="card-body d-flex flex-column" style="height:70vh">
    <div id="messages" class="flex-grow-1 overflow-auto mb-3"></div>
    <div class="input-group">
      <button id="micBtn" class="btn btn-outline-secondary" title="Voice"><i class="fa fa-microphone"></i></button>
      <input id="question" class="form-control" placeholder="Type your question...">
      <button id="sendBtn" class="btn btn-primary">Send</button>
    </div>
    <div class="mt-2" id="suggestions"></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', ()=>{
  const messages = document.getElementById('messages')
  const input = document.getElementById('question')
  const send = document.getElementById('sendBtn')
  const mic = document.getElementById('micBtn')

  function appendMessage(text, who='bot'){
    const div = document.createElement('div')
    div.className = 'mb-2 d-flex'
    div.innerHTML = `<div class="badge ${who=='bot'? 'bg-light text-dark':'bg-primary text-white'} p-2">${text}</div>`
    messages.appendChild(div)
    messages.scrollTop = messages.scrollHeight
  }

  send.addEventListener('click', async ()=>{
    const q = input.value.trim(); if(!q) return;
    appendMessage(q,'user'); input.value='';
    appendMessage('...', 'bot');
    const res = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})})
    const data = await res.json()
    messages.lastChild.remove()
    appendMessage(data.answer || 'No answer','bot')
    // suggestions
    const sug = document.getElementById('suggestions'); sug.innerHTML=''
    if(data.suggestions){
      data.suggestions.forEach(s=>{
        const b = document.createElement('button'); b.className='btn btn-sm btn-outline-secondary me-1'; b.textContent=s
        b.onclick = ()=>{ input.value = s }
        sug.appendChild(b)
      })
    }
  })

  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ send.click() } })

  // Voice
  if(window.webkitSpeechRecognition || window.SpeechRecognition){
    const Rec = window.SpeechRecognition || window.webkitSpeechRecognition
    const r = new Rec()
    r.lang = 'en-IN'
    r.onresult = (e)=>{ input.value = e.results[0][0].transcript }
    mic.addEventListener('click', ()=>{ r.start() })
  } else { mic.style.display='none' }
})
</script>

{% endblock %}
